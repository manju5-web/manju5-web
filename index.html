<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestro tesoro</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, serif;
            background: #f3e5c8;
            color: #4a3526;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 40px 25px;
        }

        .heart {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        .subtitle {
            margin-bottom: 35px;
        }

        button {
            background: #6d4c41;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;

            font-size: 18px;
            font-family: Georgia, serif;

            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 30px;
            font-size: 21px;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="heart">♡</div>

        <h1>Nuestro tesoro</h1>

        <p class="subtitle">
            Hay cuatro canciones escondidas en nuestra historia.
            <br>
            ¿Estás listo para encontrarlas?
        </p>

        <button onclick="comenzar()">
            Comenzar la aventura
        </button>

        <div id="mensaje" class="message hidden">
            🗺️ Tu aventura está a punto de comenzar...
        </div>

    </div>

    <script>

        function comenzar() {

            document.getElementById("mensaje").classList.remove("hidden");

        }

    </script>

</body>

</html>
